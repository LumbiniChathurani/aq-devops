services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - OPENAQ_API_KEY=da27a8596ad97fc4d4ea4ed651ae0df0da697b8437c7cc15a716dc6cc4d162b3
    depends_on:
      - redis
    volumes:
      - .:/app
      - /app/node_modules
    dns:
      - 8.8.8.8
      - 8.8.4.4

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"